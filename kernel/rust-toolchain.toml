# Toolchain policy: docs/TOOLCHAIN.md (GAPS4 ALET-P2-001, REQ-QUAL-002).
#
# `clippy` and `rustfmt` are requested explicitly so the quality gate cannot be skipped for lack of a
# component — a missing component would otherwise look like a passing run on a host that has neither.
#
# The channel is the DATED pin (GAPS4 ALET-P2-001, closed 2026-08-09). The floating nightly meant the
# compiler under every gate could change without a commit, so a passing run said nothing about which
# compiler it passed under. The pin was blocked before by a rustup install that rolled back on the
# development workstation; `nightly-2026-08-09` installs cleanly there now, and the gates in
# docs/TOOLCHAIN.md were re-run against it before this landed. Bumping it touches SIX places — see
# docs/TOOLCHAIN.md; check-ci-parity.sh requires both pipelines to agree.
[toolchain]
channel = "nightly-2026-08-09"
components = ["rust-src", "llvm-tools-preview", "clippy", "rustfmt"]
targets = ["aarch64-unknown-none-softfloat"]
