[package]
name = "aletheia-kernel"
version = "0.1.0"
edition = "2021"
description = "Aletheia microkernel reference — bare-metal aarch64 (QEMU virt). Enforces the same capability-secure spine invariants as the M1 hosted System Core, but in kernel space (PRD-002 §12, ADR-010 P4)."

[[bin]]
name = "aletheia-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# Hand the machine to the serial line after the gates instead of exiting with a verdict
# (REQ-CON-001, ADR-044). OFF by default so every gate keeps its exit-code contract; an interactive
# session has no verdict to give, and a gate that waited for input would hang rather than fail.
interactive = []

[dependencies]
# The single shared Hal trait (defined once in kernel-core, not copied per target).
kernel-core = { path = "../kernel-core" }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = true
