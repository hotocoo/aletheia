# Aletheia CI — realizes the VM-Testing layer of the validation pyramid (PRD §38.10, §40,
# ADR-013): every push builds the bootable microkernel image and boots it in QEMU, and runs
# the M1 hosted acceptance suite. The VM boot test is a hard gate.
name: aletheia-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  m1-hosted-acceptance:
    name: M1 hosted System-Core acceptance (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (20 M1 acceptance criteria)
        run: cargo test --manifest-path aletheia/Cargo.toml --locked

  vm-e2e:
    name: Microkernel VM boot e2e (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (aarch64 system emulation)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install Rust nightly + rust-src (for build-std)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
      - name: Boot kernel in VM and assert 11/11 invariants + exit 0
        run: ./scripts/vm-e2e.sh

  vm-e2e-riscv:
    name: Microkernel VM boot e2e — RISC-V (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (riscv64 system emulation)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + rust-src (for build-std)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
      - name: Boot riscv64 kernel in VM and assert 11/11 invariants + exit 0
        run: ./scripts/vm-e2e-riscv.sh

  keyboard-e2e:
    name: A person at the machine's own keyboard (i8042 -> IRQ1 -> decoder -> line editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # Types on the EMULATED KEYBOARD through QMP send-key, with the serial line pointed at a file
      # so nothing can be typed at it. `console-e2e.sh` types on the wire and therefore could never
      # have found ALET-P2-039 (ADR-049).
      - name: Boot the interactive image and type on the i8042
        run: ./scripts/keyboard-e2e.sh

  vinput-e2e:
    name: The input hardware rung, LIVE (virtio-input -> decoder -> session -> cursor/focus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # Drives the LIVE desktop through the REAL virtio-input devices: QMP injects absolute
      # pointer and keyboard events, the serial line is a file, and the assertions read the
      # machine's own `input` readout (ALET-P2-021 hardware rung, ADR-080).
      - name: Boot with virtio-input devices and steer the desktop
        run: ./scripts/vinput-e2e.sh

  release-package:
    name: The VMware package, built and BOOTED from its own VMDKs (dev; published on vX.Y.Z tags)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF + qemu-img + zip
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf zip
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # The same script release.yml runs on a tag, with --version dev: the packaging path is a gate
      # like every other (REQ-REL-001, docs/RELEASING.md). The package boots or the job fails.
      - name: Build the dev package and boot it from the packaged VMDKs
        run: ./scripts/release-vmware.sh --version dev
      - uses: actions/upload-artifact@v4
        with:
          name: aletheia-vmware-dev
          path: dist/

  build-all:
    name: Repository-wide integration build (all crates + all CPU targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + all cross targets (build-std needs rust-src)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Build every crate with its own pinned toolchain/target; test host crates
        run: ./scripts/build-all.sh

  vm-e2e-x86:
    name: Microkernel VM boot e2e — x86-64/AMD64 (QEMU+OVMF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (x86-64 system emulation), OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Build .efi from HEAD, assemble FAT ESP image, boot under OVMF, assert 34 ring-3 + exit 33
        run: ./scripts/vm-e2e-x86.sh

  vm-e2e-vbox:
    name: Second-hypervisor boot e2e — x86-64 on Oracle VirtualBox (ADR-046)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # GitHub-hosted runners are themselves VMs with no nested virtualization, so VirtualBox cannot
      # start a guest here. The gate reports SKIP and exits 0 rather than failing — a job that is
      # guaranteed red trains people to ignore a red pipeline (ADR-046 §6). It still RUNS, so the
      # build + image-assembly half is exercised on every push, and on a self-hosted runner with
      # nested virtualization the boot half runs too and the job becomes a real gate.
      - name: Build .efi, assemble the GPT/ESP image, boot under VirtualBox (SKIP without nested virt)
        run: ./scripts/vm-e2e-vbox.sh

  conformance:
    name: Cross-architecture semantic conformance (all three targets, one core contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for all three targets, OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 ovmf mtools perl && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + all cross targets
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Boot every target and assert each proves the same core semantic contract
        run: ./scripts/conformance.sh

  console-e2e:
    name: Interactive console (a scripted operator types at the running OS, on all three targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for all three targets, OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 ovmf mtools perl && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + all cross targets
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Boot with --features interactive, type at the prompt, halt, reboot, read it back
        run: ./scripts/console-e2e.sh

  console-ai-e2e:
    name: The model drives the console (plan in English, validate, type at a booted machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for aarch64
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm perl
      - name: Install Rust nightly + the aarch64 bare-metal target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat --toolchain nightly-2026-08-09
      # The runner has no weights and no llama-server, so the MODEL arm skips — loudly, never
      # silently — and the DETERMINISTIC arm gates the whole pipe: the registry derived from the
      # kernel's command table, plan validation, the one-step-one-line rendering contract, typing at
      # a live console, and persistence across a power cycle. The model arm is a workstation gate.
      - name: Read the namespace off a booted machine, plan, type it, assert, reboot
        run: ./scripts/console-ai-e2e.sh

  console-agent-e2e:
    name: The model drives a MULTI-STEP session on three CPU targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for all three targets, plus mtools and OVMF for the x86-64 leg
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 \
                                  ovmf mtools dosfstools perl python3
      - name: Install Rust nightly + all three bare-metal targets
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf \
                            x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # Same two-arm contract as every AI gate here (REQ-AI-007/008/009/010, ADR-054/055). The
      # runner has no weights and no llama-server, so the MODEL arm SKIPs -- loudly, never silently
      # -- and the DETERMINISTIC arm gates the whole pipe on all three targets: the loop, per-step
      # validation, the one-step-one-line rendering contract, correction of malformed proposals, all
      # four bounds, typing at a live console, and persistence across a power cycle.
      - name: Drive a bounded console session on aarch64, riscv64 and x86-64
        run: ./scripts/console-agent-e2e.sh

  comparative-bench:
    name: Aletheia against a real Linux kernel, same host, same emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for x86-64, plus mtools and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools perl python3 curl
      - name: Install Rust nightly + the UEFI target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # REQ-PERF-001, ADR-056. The Aletheia leg always runs and is what gates this job: it boots the
      # image, measures time-to-prompt and the host CPU an IDLE guest costs, which is the number that
      # regressed to 91.8% before anyone noticed. The Linux leg needs Docker and network access and
      # SKIPs loudly without them, so the comparison degrades to a self-measurement rather than
      # failing the pipeline on a CDN.
      - name: Boot both, measure time-to-prompt, idle CPU, payload size and TCB
        run: ./scripts/comparative-bench.sh

  traceability:
    name: Requirement traceability (delivered ⇒ evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert every delivered/partial requirement maps to existing evidence
        run: ./scripts/check-traceability.sh

  quality:
    name: Source quality gate (fmt, clippy -D warnings, advisories, licenses, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchains + components the gate needs (see docs/TOOLCHAIN.md)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal --component rust-src,clippy,rustfmt
          rustup component add clippy rustfmt
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Install cargo-audit (so the advisory step RUNS rather than skipping)
        run: cargo install cargo-audit --locked
      - name: fmt + clippy + advisories + licenses + SBOM
        run: ./scripts/quality-gate.sh
      - name: Publish the SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom/

  register:
    name: Gap register self-check (evidence exists, requirements tracked, rollup matches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the register's own claims hold
        run: ./scripts/check-register.sh

  boundary-docs:
    name: Boundary & audit docs match the tree (asm sites, unsafe inventory, invariant index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate inventories from source and hold the docs against them
        run: ./scripts/check-boundary-docs.sh

  ci-parity:
    name: CI coverage (every architecture boot-gated, both pipelines agree, claimed gates run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no architecture or claimed VM gate is unenforced by CI
        run: ./scripts/check-ci-parity.sh
