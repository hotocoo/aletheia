# Aletheia CI — realizes the VM-Testing layer of the validation pyramid (PRD §38.10, §40,
# ADR-013): every push builds the bootable microkernel image and boots it in QEMU, and runs
# the M1 hosted acceptance suite. The VM boot test is a hard gate.
name: aletheia-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  m1-hosted-acceptance:
    name: M1 hosted System-Core acceptance (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (20 M1 acceptance criteria)
        run: cargo test --manifest-path aletheia/Cargo.toml --locked

  vm-e2e:
    name: Microkernel VM boot e2e (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (aarch64 system emulation)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install Rust nightly + rust-src (for build-std)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
      - name: Boot kernel in VM and assert 11/11 invariants + exit 0
        run: ./scripts/vm-e2e.sh

  vm-e2e-riscv:
    name: Microkernel VM boot e2e — RISC-V (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (riscv64 system emulation)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + rust-src (for build-std)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
      - name: Boot riscv64 kernel in VM and assert 11/11 invariants + exit 0
        run: ./scripts/vm-e2e-riscv.sh

  build-all:
    name: Repository-wide integration build (all crates + all CPU targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + all cross targets (build-std needs rust-src)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Build every crate with its own pinned toolchain/target; test host crates
        run: ./scripts/build-all.sh

  vm-e2e-x86:
    name: Microkernel VM boot e2e — x86-64/AMD64 (QEMU+OVMF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (x86-64 system emulation), OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf mtools
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Build .efi from HEAD, assemble FAT ESP image, boot under OVMF, assert 34 ring-3 + exit 33
        run: ./scripts/vm-e2e-x86.sh

  vm-e2e-vbox:
    name: Second-hypervisor boot e2e — x86-64 on Oracle VirtualBox (ADR-046)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + x86_64-unknown-uefi target
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
      # GitHub-hosted runners are themselves VMs with no nested virtualization, so VirtualBox cannot
      # start a guest here. The gate reports SKIP and exits 0 rather than failing — a job that is
      # guaranteed red trains people to ignore a red pipeline (ADR-046 §6). It still RUNS, so the
      # build + image-assembly half is exercised on every push, and on a self-hosted runner with
      # nested virtualization the boot half runs too and the job becomes a real gate.
      - name: Build .efi, assemble the GPT/ESP image, boot under VirtualBox (SKIP without nested virt)
        run: ./scripts/vm-e2e-vbox.sh

  conformance:
    name: Cross-architecture semantic conformance (all three targets, one core contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for all three targets, OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 ovmf mtools perl && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + all cross targets
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Boot every target and assert each proves the same core semantic contract
        run: ./scripts/conformance.sh

  console-e2e:
    name: Interactive console (a scripted operator types at the running OS, on all three targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU for all three targets, OVMF firmware, mtools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 ovmf mtools perl && (sudo apt-get install -y qemu-system-riscv || true)
      - name: Install Rust nightly + all cross targets
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-08-09
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Boot with --features interactive, type at the prompt, halt, reboot, read it back
        run: ./scripts/console-e2e.sh

  traceability:
    name: Requirement traceability (delivered ⇒ evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert every delivered/partial requirement maps to existing evidence
        run: ./scripts/check-traceability.sh

  quality:
    name: Source quality gate (fmt, clippy -D warnings, advisories, licenses, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchains + components the gate needs (see docs/TOOLCHAIN.md)
        run: |
          rustup toolchain install nightly-2026-08-09 --profile minimal --component rust-src,clippy,rustfmt
          rustup component add clippy rustfmt
          rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
      - name: Install cargo-audit (so the advisory step RUNS rather than skipping)
        run: cargo install cargo-audit --locked
      - name: fmt + clippy + advisories + licenses + SBOM
        run: ./scripts/quality-gate.sh
      - name: Publish the SBOM as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/sbom/

  register:
    name: Gap register self-check (evidence exists, requirements tracked, rollup matches)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the register's own claims hold
        run: ./scripts/check-register.sh

  ci-parity:
    name: CI coverage (every architecture boot-gated, both pipelines agree, claimed gates run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no architecture or claimed VM gate is unenforced by CI
        run: ./scripts/check-ci-parity.sh
