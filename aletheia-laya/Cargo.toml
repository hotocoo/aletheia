[package]
name = "aletheia-laya"
version = "0.7.2"
edition = "2021"
description = "The native System-1 runtime for Laya decision checkpoints: one forward pass, on the Aletheia decision wire (ADR-241)"
publish = false

[[bin]]
name = "aletheia-laya"
path = "src/main.rs"

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
# Oniguruma (BSD-2-Clause) for the tokenizer's pre-tokenizer regex; no progress bars, no C++ suffix arrays.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9.1", features = ["metal", "accelerate"] }
candle-nn = { version = "0.9.1", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.9.1", features = ["metal", "accelerate"] }

[profile.release]
panic = "abort"
