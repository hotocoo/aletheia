[package]
name = "aletheia"
version = "0.1.0"
edition = "2021"
description = "Aletheia — AI-native OS. M1 hosted System-Core reference implementation."

[lib]
name = "aletheia"
path = "src/lib.rs"

[[bin]]
name = "aletheiad"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chacha20poly1305 = "0.11"
# Asymmetric component provenance (ADR-025 Phase 2 / REQ-BOOT-002). Pure-Rust (dalek), no C toolchain
# — consistent with the sha2/chacha20poly1305 precedent (ADR-004). Default features are pure-Rust;
# the SIMD backend is opt-in and stays off. Verifier holds PUBLIC keys only (cannot forge).
ed25519-dalek = "3"
rand = "0.10"
ulid = { version = "3", features = ["serde"] }
wasmi = "1.1.0"
# The kernel's arch-independent contracts — depended on for ONE thing: `shell::COMMANDS`, the
# command table the console dispatcher and its `help` are generated from, so the menu the model is
# shown cannot drift from the commands the kernel accepts (ADR-053). `no_std`, zero dependencies,
# and nothing in the hosted Core's own paths reaches for it.
kernel-core = { path = "../kernel-core" }

[dev-dependencies]
proptest = "1"
wat = "1"

[profile.dev]
opt-level = 0
