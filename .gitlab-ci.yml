# Aletheia CI (GitLab) — mirror of the GitHub pipeline for the self-hosted origin.
# Realizes the VM-Testing layer of the validation pyramid (PRD §38.10, §40, ADR-013):
# build the bootable microkernel image, boot it in QEMU, and run the M1 acceptance suite.
stages:
  - test

m1-hosted-acceptance:
  stage: test
  image: rust:latest
  script:
    - cargo test --manifest-path aletheia/Cargo.toml --locked

vm-e2e:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-arm perl
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup component add rust-src --toolchain nightly-2026-08-09
    - ./scripts/vm-e2e.sh

vm-e2e-riscv:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-misc qemu-system-riscv perl
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup component add rust-src --toolchain nightly-2026-08-09
    - ./scripts/vm-e2e-riscv.sh

build-all:
  stage: test
  image: rust:latest
  script:
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup component add rust-src --toolchain nightly-2026-08-09
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - ./scripts/build-all.sh

vm-e2e-x86:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-x86 ovmf mtools
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - ./scripts/vm-e2e-x86.sh

vm-e2e-vbox:
  stage: test
  image: rust:latest
  script:
    # The SECOND hypervisor (ADR-046): the same image, booted by an independent implementation of the
    # platform contract. Shared runners have no nested virtualization, so the gate reports SKIP and
    # exits 0 there; on a runner that can nest, the boot half runs and this becomes a real gate. The
    # image builder is dependency-free (mkesp.py), so this leg needs no mtools/OVMF.
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup target add x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - ./scripts/vm-e2e-vbox.sh

conformance:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-arm qemu-system-misc qemu-system-riscv qemu-system-x86 ovmf mtools perl
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup component add rust-src --toolchain nightly-2026-08-09
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - ./scripts/conformance.sh

console-e2e:
  stage: test
  image: rust:latest
  script:
    # The interactive console (REQ-CON-001, ADR-044): build WITH the feature, type at the running
    # machine, halt, reboot, and require that what was typed is still there.
    - apt-get update && apt-get install -y qemu-system-arm qemu-system-misc qemu-system-riscv qemu-system-x86 ovmf mtools perl
    - rustup toolchain install nightly-2026-08-09 --profile minimal
    - rustup component add rust-src --toolchain nightly-2026-08-09
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - ./scripts/console-e2e.sh

traceability:
  stage: test
  image: rust:latest
  script:
    - ./scripts/check-traceability.sh

quality:
  stage: test
  image: rust:latest
  script:
    # Same toolchain + components as the GitHub pipeline (docs/TOOLCHAIN.md; the DATED pin landed
    # 2026-08-09, ALET-P2-001 closed). cargo-audit is installed so the advisory step RUNS instead
    # of skipping.
    - rustup toolchain install nightly-2026-08-09 --profile minimal --component rust-src,clippy,rustfmt
    - rustup component add clippy rustfmt
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly-2026-08-09
    - cargo install cargo-audit --locked
    - ./scripts/quality-gate.sh
  artifacts:
    paths:
      - build/sbom/
    expire_in: 1 week

register:
  stage: test
  image: rust:latest
  script:
    - ./scripts/check-register.sh

ci-parity:
  stage: test
  image: rust:latest
  script:
    - ./scripts/check-ci-parity.sh
