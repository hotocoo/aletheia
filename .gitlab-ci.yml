# Aletheia CI (GitLab) — mirror of the GitHub pipeline for the self-hosted origin.
# Realizes the VM-Testing layer of the validation pyramid (PRD §38.10, §40, ADR-013):
# build the bootable microkernel image, boot it in QEMU, and run the M1 acceptance suite.
stages:
  - test

m1-hosted-acceptance:
  stage: test
  image: rust:latest
  script:
    - cargo test --manifest-path aletheia/Cargo.toml --locked

vm-e2e:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-arm perl
    - rustup toolchain install nightly --profile minimal
    - rustup component add rust-src --toolchain nightly
    - ./scripts/vm-e2e.sh

vm-e2e-riscv:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-misc perl
    - rustup toolchain install nightly --profile minimal
    - rustup component add rust-src --toolchain nightly
    - ./scripts/vm-e2e-riscv.sh

build-all:
  stage: test
  image: rust:latest
  script:
    - rustup toolchain install nightly --profile minimal
    - rustup component add rust-src --toolchain nightly
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly
    - ./scripts/build-all.sh

vm-e2e-x86:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-x86 ovmf mtools
    - rustup toolchain install nightly --profile minimal
    - rustup target add x86_64-unknown-uefi --toolchain nightly
    - ./scripts/vm-e2e-x86.sh

conformance:
  stage: test
  image: rust:latest
  script:
    - apt-get update && apt-get install -y qemu-system-arm qemu-system-misc qemu-system-x86 ovmf mtools perl
    - rustup toolchain install nightly --profile minimal
    - rustup component add rust-src --toolchain nightly
    - rustup target add aarch64-unknown-none-softfloat riscv64gc-unknown-none-elf x86_64-unknown-uefi --toolchain nightly
    - ./scripts/conformance.sh

traceability:
  stage: test
  image: rust:latest
  script:
    - ./scripts/check-traceability.sh

ci-parity:
  stage: test
  image: rust:latest
  script:
    - ./scripts/check-ci-parity.sh
