[package]
name = "aletheia-userland"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hello"
path = "src/hello.rs"
test = false
bench = false

[[bin]]
name = "show"
path = "src/show.rs"
test = false
bench = false

[[bin]]
name = "counter"
path = "src/counter.rs"
test = false
bench = false

[[bin]]
name = "big"
path = "src/big.rs"
test = false
bench = false

[[bin]]
name = "wide"
path = "src/wide.rs"
test = false
bench = false

[[bin]]
name = "draw"
path = "src/draw.rs"
test = false
bench = false

[[bin]]
name = "probe"
path = "src/probe.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
panic = "abort"
debug = false
strip = true
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
