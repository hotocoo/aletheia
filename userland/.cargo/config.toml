[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "link-arg=-Taarch64.ld", "-C", "relocation-model=static"]
[target.riscv64gc-unknown-none-elf]
rustflags = ["-C", "link-arg=-Triscv64.ld", "-C", "relocation-model=static"]
[target.x86_64-unknown-none]
# `x86_64-unknown-none` uses the kernel code model and its prebuilt `core` was compiled with it, so
# LTO refuses a different one here. At 0x4000_0000 the model's sign-extended 32-bit absolute
# relocations still reach every byte of a program, and any that did not would fail the link.
rustflags = ["-C", "link-arg=-Tx86_64.ld", "-C", "relocation-model=static"]
