# Aletheia's OWN model — the first-party language model being pretrained for this OS (ADR-052).
#
# This manifest exists BEFORE the weights do, on purpose. The point of the registry is that the
# operator can say `aletheiad model use aletheia-lm` the moment pretraining finishes without editing
# any source, and — just as important — that saying it BEFORE pretraining finishes produces a named
# refusal rather than a silent fall-back to another model. A switch that appears to work while
# quietly serving something else is the failure mode this entry is shaped to prevent.
#
# Training lives outside this repo (MLX, Apple silicon): `dl/src/aletheia_lm/`, checkpoints under
# `$ALETHEIA_RUN_DIR/checkpoints`. Nothing in this repository trains it, and nothing here downloads
# it: it is not on a hub, so `aletheiad model pull` refuses it by name.

[model]
id          = "aletheia-lm"
name        = "Aletheia-LM (first-party, in training)"
# Empty because the artifact is produced locally rather than fetched. `model pull` treats an empty
# repo as "not provisionable" and says so, instead of constructing a hub URL that cannot exist.
repo        = ""
file        = ""
quant       = ""
sha256      = ""
size_bytes  = 0
serve_id    = "aletheia"
default     = false
# `pretraining` | `ready`. While `pretraining`, `model use` SELECTS the entry and then reports the
# model absent; it never silently promotes the deterministic interpreter into the model's place.
status      = "pretraining"
# The environment variable that names the finished weights. Set it to a converted GGUF (llama.cpp
# backend) or to a checkpoint directory (native backend, when one exists) and re-run `model status`.
path_env    = "ALETHEIA_LM_MODEL"

[runtime]
backend           = "llama_cpp"
endpoint          = "http://localhost:8080"
# 2048, not 8192: the model is pretrained at seq_len 2048 and its global (non-windowed) layers have
# never seen a RoPE position past that, so a longer prompt returns confident noise rather than an
# error. `ContextEngine` budgets in characters and does not read this field today, so the old 8192
# was cosmetic — but a manifest that advertises a context the weights cannot honour is the kind of
# fact that stops being cosmetic the moment something starts trusting it. The MLX shim refuses
# `prompt + max_tokens > 2048` with a 400 rather than truncating, because truncating a rendered
# prompt drops the system message and answers from the transcript alone.
context           = 2048
thinking          = false
temperature       = 0.3
top_p             = 0.95
structured_output = "gbnf-grammar"

[provision]
# There is no hub artifact. Provision by pointing Aletheia at the trained weights:
#   export ALETHEIA_LM_MODEL=/path/to/aletheia-lm.gguf
#   aletheiad model use aletheia-lm
#   aletheiad model status          # must print `ready`, naming the resolved path
# Until then this entry is selectable and honest about being empty.
#
# WALKED END TO END on 2026-08-10 against a mid-pretraining checkpoint, and the path that works is
# NOT a GGUF. `aletheia_tok_v3` is a byte-level BPE with a whitespace-crossing (`xw`) split regex,
# and llama.cpp silently substitutes a default pretokenizer for regexes it does not recognise —
# a token-boundary mismatch that reads exactly like an undertrained model. So the checkpoint is
# served from MLX by `dl/src/aletheia_lm/serve.py`, which speaks the only three things this OS
# actually requires of `llama_cpp` (see `src/ai/llama.rs`): `/v1/models` advertising an id that
# contains `serve_id`, non-streaming `/v1/chat/completions`, and a `usage` block.
#
#   PYTHONPATH=src python3 -m aletheia_lm.serve --port 8081     # in the dl repo
#   export ALETHEIA_LM_MODEL=.../checkpoints/step_005500        # a DIRECTORY resolves fine
#   export MODEL_ENDPOINT=http://localhost:8081                 # AiConfig::resolve override
#   aletheiad model use aletheia-lm                             # -> `serving: yes — aletheia-lm`
#
# ---------------------------------------------------------------------------
# v4 run notes (2026-08-26). Designed at 3.036B, then resized THE SAME DAY to the
# measured wall-clock-loss frontier of this box: 1.183B total under the SAME
# Llama-family contract (d=2048 x 24 layers, GQA 16/4 hd128, SwiGLU 5632, RoPE
# 500k, tied embeddings — still NO sliding-window/QK-norm so llama.cpp's plain
# llama arch can express it and Unsloth can quantize to UD-IQ4_NL without
# surgery; the 3B shape stays in git history for a cloud-GPU rerun where it is
# genuinely the right size). Tokenizer is aletheia_tok_v4: byte-level BPE at
# 49,152, fitted on code + prose
# (Wikipedia-en, FineWeb-Edu). Weights train bf16 end to end; export_hf.py in
# dl/src/aletheia_lm writes the HF dir for later UD-IQ4_NL conversion. Context
# stays 2048: that is what the weights are trained at. See dl/docs/PRETRAIN-3B.md.
# ---------------------------------------------------------------------------
# `model bench` over that seam planned 0/6 operations (`InvalidOutput`, median 10.9 s), which is the
# CORRECT result for a base model 5,500 steps into a 500,000-step run: the call connected, was
# timed, and was rejected on content rather than falling back to the deterministic interpreter.
# Record: `dl/docs/SERVING-SEAM.md`. GGUF stays the right answer for an OS that must run without a
# Python process, and the check that makes it safe is id-level tokenizer parity, never eyeballed text.
