# System 1 for Aletheia's console (ADR-187): the `laya` backend's base checkpoint fine-tuned on a
# corpus generated from the kernel's own command table (`scripts/system1/corpus.py`, committed as
# docs/evidence/system1/console-corpus.jsonl) by `scripts/system1/laya_finetune.py`: v2 (ADR-193) =
# 6,643 examples, top 12 encoder layers + decision head, 5 epochs, temperatures refitted on
# held-out paraphrase groups. v1 (ADR-187) remains the asset of release v0.3.0, v2 of v0.6.0.
# v4 (ADR-245) = v2 warm-started on the corpus's new rows for the commands added since (weight,
# passwd, login, logout, whoami) plus a replay of 250 old paraphrase groups, top 4 encoder layers,
# 3 epochs on CPU; it is the asset of release v0.7.0. Served natively by `aletheia-laya` (ADR-241).
#
# Not on any hub: it ships as a GitHub release asset. `aletheiad model pull aletheia-console-s1`
# downloads it, refuses it unless the archive's SHA-256 matches, and unpacks it into the local
# model cache under `repo`, where the registry finds it. Serve it with the backend's sidecar:
#   python3 scripts/system1/laya_server.py <dir of model.safetensors> --serve-id aletheia-console-s1
#   (the sidecar needs the backend's package: pip install laya)

[model]
id          = "aletheia-console-s1"
name        = "Aletheia console System 1 v4 (fine-tuned from v2, 2026-10-08)"
role        = "system1"
repo        = "aletheia/system1-console"
file        = "model.safetensors"
sha256      = "79cf9ea34fad4de0e906a90cd8144d5ab35a8b7c6d1c5a2485d9c82e65899a3e"
size_bytes  = 842609220
serve_id    = "aletheia-console-s1"
default     = true
status      = "ready"

[runtime]
backend     = "laya"
endpoint    = "http://127.0.0.1:8091"
confidence  = 0.9

[provision]
url            = "https://github.com/hotocoo/aletheia/releases/download/v0.7.0/aletheia-console-s1-v4.tar"
archive_sha256 = "4cdb1fe5ec601554a7e0fb495b6c7dee1ab36629086e1d4f3c0f1ad627697b22"
