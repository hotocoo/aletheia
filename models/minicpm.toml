# Aletheia AI model manifest — the previous default, kept as a SELECTABLE alternative (ADR-052).
#
# This model was the pinned default through the ADR-017 waves. It is retained rather than deleted so
# `aletheiad model use minicpm` can put the OS back on the model every earlier measurement in
# STATUS.md was taken against — a benchmark whose baseline has been deleted is not a baseline.
#
# The model INTEGRATION ships in-repo (aletheia/src/ai/); the WEIGHTS are an external artifact
# provisioned ON DEMAND into the local Hugging Face cache by `aletheiad model pull` — never
# committed to git.

[model]
id          = "minicpm"
name        = "MiniCPM5-1B-Claude-Opus-Fable5-V2-Thinking"
repo        = "GnLOLot/MiniCPM5-1B-Claude-Opus-Fable5-V2-Thinking-GGUF"
file        = "MiniCPM5-1B-Claude-Opus-Fable5-V2-Thinking-Q8_0.gguf"
quant       = "Q8_0"
sha256      = "fc3ee1eddd305c155f63b6bd7bb189daa4d5f226ca325ab219bd7acd3b00ec77"
size_bytes  = 1153529184
serve_id    = "MiniCPM"
default     = false

[runtime]
backend           = "llama_cpp"
endpoint          = "http://localhost:8080"
context           = 8192            # typical; the model supports up to 131072
# A forced-thinking model: a strict grammar collides with the `<think>` phase, so the request path
# sends `enable_thinking = false` for it. This flag is what selects that behavior per-model rather
# than hardcoding one model's quirk into the provider.
thinking          = true
temperature       = 0.7
top_p             = 0.95
structured_output = "gbnf-grammar"  # constrains generation to the Aletheia Plan schema

[provision]
# Weights are NOT in git. Provision them into the local HF cache with either:
#   aletheiad model use minicpm && aletheiad model pull
#   huggingface-cli download GnLOLot/MiniCPM5-1B-Claude-Opus-Fable5-V2-Thinking-GGUF MiniCPM5-1B-Claude-Opus-Fable5-V2-Thinking-Q8_0.gguf
# Or set MODEL_PATH to an existing .gguf. The provider falls back to the deterministic interpreter
# whenever no model is available (the OS stays fully functional without a resident model).
